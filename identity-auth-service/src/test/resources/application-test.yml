spring:
  datasource:
    url: jdbc:h2:mem:fintech_auth_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

payflow:
  jwt:
    secret: payflow-fintech-super-secure-production-256bit-secret-key-32bytes
    expiration-ms: 3600000

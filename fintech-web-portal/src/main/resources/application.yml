server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: fintech-web-portal
  lifecycle:
    timeout-per-shutdown-phase: 30s
  thymeleaf:
    cache: false
  session:
    store-type: none

services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  wallet:
    url: ${WALLET_SERVICE_URL:http://localhost:8082}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
